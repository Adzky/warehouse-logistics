spring.application.name=warehouse-logistics

spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_logistics
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

warehouse.security.bootstrap-admin-username=${BOOTSTRAP_ADMIN_USERNAME:}
warehouse.security.bootstrap-admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}