<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${title}">Warehouse Logistics</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" th:href="@{/}">
      <span class="brand-mark" aria-hidden="true">WL</span>
      Warehouse Logistics
    </a>
    <nav class="nav" aria-label="Primary">
      <a th:href="@{/}" th:attr="aria-current=${currentPage == 'dashboard'} ? 'page'">Dashboard</a>
      <a th:href="@{/warehouses}" th:attr="aria-current=${currentPage == 'warehouses'} ? 'page'">Warehouses</a>
      <a th:href="@{/products}" th:attr="aria-current=${currentPage == 'products'} ? 'page'">Products</a>
      <a th:href="@{/inventory}" th:attr="aria-current=${currentPage == 'inventory'} ? 'page'">Inventory</a>
      <a th:href="@{/receipts}" th:attr="aria-current=${currentPage == 'receipts'} ? 'page'">Receiving</a>
      <a th:href="@{/orders}" th:attr="aria-current=${currentPage == 'orders'} ? 'page'">Orders</a>
      <a th:href="@{/movements}" th:attr="aria-current=${currentPage == 'movements'} ? 'page'">Movements</a>
      <a th:href="@{/suppliers}" th:attr="aria-current=${currentPage == 'suppliers'} ? 'page'">Suppliers</a>
    </nav>
  </div>
</header>
<div class="flash-list" th:if="${successMessage != null or errorMessage != null}">
  <div class="flash flash-success" role="status" th:if="${successMessage}" th:text="${successMessage}"></div>
  <div class="flash flash-error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>
</div>
<main id="main" class="page" th:insert="${content}"></main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
