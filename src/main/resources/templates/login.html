<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Warehouse Logistics</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
  <section class="panel" style="max-width: 28rem; margin: 8vh auto">
    <h1>Sign in</h1>
    <p class="lede">Use your warehouse account to continue.</p>
    <p class="flash flash-error" role="alert" th:if="${param.error}">Username or password is incorrect.</p>
    <p class="flash flash-success" role="status" th:if="${param.logout}">You have signed out.</p>
    <form th:action="@{/login}" method="post">
      <div>
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Sign in</button>
    </form>
  </section>
</main>
</body>
</html>
